AWSTemplateFormatVersion: '2010-09-09'
Description: Sophia hackathon demo - private static site, throttled HTTP API, Lambda, DynamoDB and one Bedrock model.
Parameters:
  ArtifactBucket:
    Type: String
    Description: Private deployment bucket in this region; created by scripts/deploy-aws.mjs.
  ArtifactKey:
    Type: String
    Description: Content-addressed ZIP object key.
  AccessCode:
    Type: String
    NoEcho: true
    MinLength: 12
    MaxLength: 128
    Description: Shared demo access code; provide privately to judges. Never embed in browser assets.
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    # Amazon's own models only: third-party models are billed through AWS Marketplace, which promotional credits may not cover.
    AllowedPattern: 'amazon\.[a-z0-9.:-]+'
    ConstraintDescription: Use an Amazon model such as amazon.nova-lite-v1:0. Third-party models may be billed outside AWS credits.
    Description: A directly invocable Amazon foundation-model ID. Confirm model availability first.
  MaxDailyModelCalls:
    Type: Number
    Default: 200
    MinValue: 1
    MaxValue: 1000
    Description: Global per-day model-call ceiling in application code, not a total AWS spending cap.
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional Google Gemini API key for the opt-in "AI Gemini" chat toggle. Empty hides the toggle.
  GeminiModel:
    Type: String
    Default: gemini-3.5-flash-lite
    AllowedPattern: '[a-z0-9.-]+'
    Description: Gemini model used when the toggle is on.
  UseCloudFront:
    Type: String
    Default: 'yes'
    AllowedValues: ['yes', 'no']
    Description: yes serves the web app from private S3 through CloudFront; no serves it from the Lambda function through API Gateway (for accounts that cannot create CloudFront resources yet).
  SpokenReplies:
    Type: String
    Default: polly
    AllowedValues: [polly, browser]
    Description: polly speaks replies with the Amazon Polly neural voice Kajal (Indian English); browser uses the viewer's own browser voice.
  ReservedConcurrency:
    Type: Number
    Default: -1
    MinValue: -1
    MaxValue: 5
    Description: Lambda reserved concurrency. -1 reserves none (needed on new accounts with a 10-execution limit); 0 disables API compute.
Conditions:
  WithCloudFront: !Equals [!Ref UseCloudFront, 'yes']
  WithoutCloudFront: !Equals [!Ref UseCloudFront, 'no']
  ReserveConcurrency: !Not [!Equals [!Ref ReservedConcurrency, '-1']]

Resources:
  SessionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: Sophia
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SophiaRuntimeOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt FunctionLogGroup.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt SessionTable.Arn
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}'
              # SynthesizeSpeech has no voice-level resource; '*' only covers lexicons, which Sophia does not use.
              - Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: '*'
  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: lambda.handler
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 256
      Timeout: 25
      ReservedConcurrentExecutions: !If [ReserveConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      LoggingConfig:
        LogGroup: !Ref FunctionLogGroup
        LogFormat: JSON
      Environment:
        Variables:
          SOPHIA_PROVIDER: bedrock
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          SOPHIA_TABLE: !Ref SessionTable
          SOPHIA_ACCESS_CODE: !Ref AccessCode
          SOPHIA_MAX_DAILY_CALLS: !Ref MaxDailyModelCalls
          SOPHIA_VOICE: !Ref SpokenReplies
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
          NODE_ENV: production
      Tags:
        - Key: Project
          Value: Sophia
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      DisableExecuteApiEndpoint: false
      Tags:
        Project: Sophia
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 28000
  ApiProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /api/{proxy+}'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ApiIntegration}'
  ApiRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /api'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ApiIntegration}'
  SiteRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: WithoutCloudFront
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ApiIntegration}'
  SitePermission:
    Type: AWS::Lambda::Permission
    Condition: WithoutCloudFront
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/$default'
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        # Without CloudFront, each page load also fetches the app's files through the API.
        ThrottlingBurstLimit: !If [WithCloudFront, 5, 30]
        ThrottlingRateLimit: !If [WithCloudFront, 2, 10]
        DetailedMetricsEnabled: false
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId","status":"$context.status","responseLength":"$context.responseLength"}'
  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/api*'
  SiteBucket:
    Type: AWS::S3::Bucket
    Condition: WithCloudFront
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: Sophia
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: WithCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-${AWS::Region}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Condition: WithCloudFront
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-${AWS::Region}-api'
        CookiesConfig:
          CookieBehavior: all
        QueryStringsConfig:
          QueryStringBehavior: all
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Content-Type
            - Origin
            - Accept
            - X-Sophia-CSRF
            - X-Forwarded-Host
            # MCP Streamable HTTP headers. External MCP clients can also call the
            # ApiUrl output (API Gateway) directly, without CloudFront.
            - Mcp-Session-Id
            - Mcp-Protocol-Version
  ViewerHostFunction:
    Type: AWS::CloudFront::Function
    Condition: WithCloudFront
    Properties:
      Name: !Sub '${AWS::StackName}-${AWS::Region}-host'
      AutoPublish: true
      FunctionConfig:
        Comment: Preserve the real viewer host for Sophia same-origin checks.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.headers['x-forwarded-host'] = {value: request.headers.host.value};
          return request;
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: WithCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Sophia Alexa+ simulation
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CacheBehaviors:
          - PathPattern: '/api/*'
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ViewerHostFunction.FunctionARN
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: Sophia
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: WithCloudFront
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OnlyThisCloudFront
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
Outputs:
  SiteUrl:
    Description: HTTPS URL. Unlock using the private access code.
    Value: !If
      - WithCloudFront
      - !Sub 'https://${Distribution.DomainName}'
      - !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  SiteBucket:
    Condition: WithCloudFront
    Value: !Ref SiteBucket
  DistributionId:
    Condition: WithCloudFront
    Value: !Ref Distribution
  FunctionName:
    Value: !Ref ApiFunction
  SessionTable:
    Value: !Ref SessionTable
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  McpUrl:
    Description: Streamable HTTP MCP endpoint (served by the /api/{proxy+} route). Send the access code as Authorization Bearer.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/mcp'
